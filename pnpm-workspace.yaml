allowBuilds:
  esbuild: true
  "@parcel/watcher": true
  unrs-resolver: true
  vue-demi: false
  sharp: true
packages:
  - playground
  - packages/*
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@michaelthielemann/*'
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 129600
blockExoticSubdeps: true

auditConfig:
  ignoreGhsas:
    - GHSA-gcqx-w48m-w2h4

overrides:
  'glob@13': ^14.0.2
  'minimatch@10': ^11.0.1
  '@nuxt/eslint-config>eslint-plugin-import-x': ^4.18.1
