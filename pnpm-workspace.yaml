allowBuilds:
  esbuild: true
  "@parcel/watcher": true
  unrs-resolver: true
  vue-demi: false
  sharp: true
packages:
  - playground
  - packages/*
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@michaelthielemann/*'
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 129600
blockExoticSubdeps: true

overrides:
  'glob@13': ^14.0.2
